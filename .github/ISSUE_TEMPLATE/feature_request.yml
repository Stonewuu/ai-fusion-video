name: 功能建议
description: 提议新功能、体验优化或现有能力改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索现有 Issue，并尽量说明要解决的问题，而不只是描述某个具体实现。

  - type: dropdown
    id: area
    attributes:
      label: 功能模块
      description: 选择最接近建议范围的模块。
      options:
        - 剧本或项目管理
        - 分镜编辑
        - AI 绘图或视频生成
        - AI 模型配置
        - Agent 工作流
        - 素材或存储管理
        - 前端交互与视觉体验
        - 后端服务或 API
        - Docker 或部署
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁会在什么场景下遇到什么问题？当前流程有哪些限制？
      placeholder: 当我……时，希望能够……，因为目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、交互或接口；如有示例可一并提供。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 说明你尝试过的替代方法，或其他可接受的解决方式。

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可直接拖入原型、截图、流程图或相关资料。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
        - label: 该建议与融光的 AI 视频创作场景相关。
          required: true
