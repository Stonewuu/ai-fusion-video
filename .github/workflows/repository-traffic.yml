name: 仓库流量报告
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: 从 GitHub 读取最新流量
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'tools/github-traffic/**'
      - '.github/workflows/repository-traffic.yml'

permissions: {}
concurrency:
  group: repository-traffic
  cancel-in-progress: false

jobs:
  report:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 读取报告程序
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/github-traffic
          persist-credentials: false
      - name: 读取历史归档
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: archive
      - name: 验证统计规则
        run: node --test tools/github-traffic/archive.test.mjs
      - name: 采集每日流量
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?请在仓库 Actions Secrets 中配置 TRAFFIC_READ_TOKEN}"
          samples="$(mktemp -d)"
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones?per=day" > "$samples/clones.json"
          gh api "repos/$GITHUB_REPOSITORY/traffic/views?per=day" > "$samples/views.json"
          node tools/github-traffic/archive.mjs update "$GITHUB_REPOSITORY" "$samples" archive/history.json
      - name: 生成报告并保存历史
        shell: bash
        run: |
          set -euo pipefail
          node tools/github-traffic/build.mjs archive/history.json archive/index.html
          git -C archive add -- history.json index.html
          if ! git -C archive diff --cached --quiet; then
            git -C archive config user.name 'github-actions[bot]'
            git -C archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C archive commit -m "更新仓库流量报告 $(date -u +%F)"
            git -C archive push origin HEAD:refs/heads/traffic-history
          fi
          mkdir -p "$RUNNER_TEMP/traffic-site"
          cp archive/history.json archive/index.html "$RUNNER_TEMP/traffic-site/"
      - name: 准备 Pages 文件
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/traffic-site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布报告
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
