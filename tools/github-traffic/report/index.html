<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>仓库流量 · AI Fusion Video</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23242743'/%3E%3Cpath d='M7 27 16 17l5 5 11-13' fill='none' stroke='%23abf1d7' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!--STYLES-->
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-repo" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 1 5 17.5zM5 17.5A2.5 2.5 0 0 1 7.5 15H20M9 6h7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 19v-6m7 6V5m7 14V9"/></symbol>
  </svg>
  <header class="masthead">
    <div class="shell mast-content">
      <a class="repo-link" id="repo-link" aria-label="在 GitHub 查看项目仓库">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="m6 24 8-9 5 5L30 8"/><path class="brand-trail" d="m7 29 8-9"/></svg></span>
        <span id="repo-owner" class="repo-owner"></span><span class="slash">/</span><strong id="repo-name"></strong>
      </a>
      <div class="mast-actions">
        <a class="archive-link" id="archive-link"><svg class="icon"><use href="#i-repo"/></svg><span>数据归档</span><svg class="icon small"><use href="#i-arrow"/></svg></a>
        <button type="button" id="theme" class="icon-button" aria-label="切换明暗主题" title="切换明暗主题"><svg class="icon"><use href="#i-theme"/></svg></button>
      </div>
    </div>
  </header>
  <main class="shell">
    <section class="overview" aria-labelledby="report-title">
      <div class="hero-head">
        <div><h1 id="report-title">仓库流量</h1><p id="summary-range" class="hero-range"></p></div>
        <span class="window-tag"><svg class="icon small"><use href="#i-calendar"/></svg>最近 14 天</span>
      </div>
      <div class="kpis" id="metrics"></div>
    </section>

    <section class="panel trend" aria-labelledby="trend-heading">
      <div class="panel-head">
        <h2 id="trend-heading">流量趋势</h2>
        <div class="seg ranges" id="ranges" role="group" aria-label="趋势时间范围">
          <button type="button" data-range="7">7 天</button>
          <button type="button" data-range="14" aria-pressed="true">14 天</button>
          <button type="button" data-range="30">30 天</button>
          <button type="button" data-range="90">90 天</button>
          <button type="button" data-range="all">全部</button>
          <button type="button" data-range="custom" aria-label="自选日期" title="自选日期" aria-expanded="false" aria-controls="custom-range"><svg class="icon small"><use href="#i-calendar"/></svg></button>
        </div>
      </div>
      <form class="custom-range" id="custom-range" hidden>
        <label>开始日期<input type="date" id="from-date" required></label>
        <label>结束日期<input type="date" id="to-date" required></label>
        <button class="outline-button" type="submit">应用日期</button>
      </form>
      <div class="plot-head">
        <div class="plot-metrics"><span id="legend-basis"></span><div class="legend" id="legend" role="group" aria-label="显示的数据系列"></div></div>
        <div class="seg units" id="units" role="group" aria-label="统计指标">
          <button type="button" data-unit="count" aria-pressed="true">次数</button>
          <button type="button" data-unit="uniques">每日去重人数</button>
        </div>
      </div>
      <div class="plot-wrap" id="plot-wrap">
        <svg id="plot" tabindex="0" role="group" aria-label="流量折线图，使用左右方向键按天查看，Home 和 End 跳到首尾" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="empty-chart" id="empty-chart" hidden>这段时间暂无流量记录</p>
      </div>
      <div class="plot-footer">
        <span id="trend-range"></span><span>按日统计 · UTC</span>
      </div>
      <span class="sr-only" aria-live="polite" id="chart-reading"></span>
    </section>

    <section class="panel details" aria-labelledby="details-heading">
      <div class="panel-head">
        <div class="title-inline"><h2 id="details-heading">每日明细</h2><span id="record-count" class="muted"></span></div>
        <button type="button" id="export" class="outline-button"><svg class="icon"><use href="#i-download"/></svg>导出 CSV</button>
      </div>
      <div class="table-scroll" role="region" aria-label="每日流量数据，可横向滚动" tabindex="0">
        <table>
          <thead><tr><th scope="col">日期</th><th scope="col">克隆次数</th><th scope="col">独立克隆者</th><th scope="col">浏览次数</th><th scope="col">独立访客</th></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="table-range"></span>
        <div class="pager"><button class="icon-button" type="button" id="previous" aria-label="上一页" title="上一页"><svg class="icon"><use href="#i-prev"/></svg></button><span id="page-count"></span><button class="icon-button" type="button" id="next" aria-label="下一页" title="下一页"><svg class="icon"><use href="#i-next"/></svg></button></div>
      </div>
    </section>
    <footer class="page-footer"><span><svg class="icon small"><use href="#i-clock"/></svg><span id="updated"></span></span><a href="https://docs.github.com/zh/rest/metrics/traffic">GitHub 统计说明 <svg class="icon small"><use href="#i-arrow"/></svg></a></footer>
  </main>
  <!--DATA-->
  <!--APP-->
</body>
</html>
