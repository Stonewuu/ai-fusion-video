# ============================================
# 融光 - Docker Compose (拉取预构建镜像)
# ============================================
# 部署配置: 基于 .env.example 创建 .env，并只修改 .env
# 使用方式: docker compose up -d
# ============================================

services:
  # ---------- 基础设施 ----------
  mysql:
    image: mysql:8.0
    container_name: fusion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_fusion_video}
      MYSQL_USER: "${MYSQL_USERNAME:-}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # 如需从宿主机访问 MySQL，取消以下注释：
    # ports:
    #   - "127.0.0.1:43306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fusion-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis_data:/data
    # 如需从宿主机访问 Redis，取消以下注释：
    # ports:
    #   - "127.0.0.1:46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 后端 ----------
  backend:
    image: stonewuu/ai-fusion-video:latest
    container_name: fusion-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_fusion_video}
      # 兼容旧部署：未配置应用账号时继续使用 root 与 MYSQL_ROOT_PASSWORD。
      MYSQL_USERNAME: "${MYSQL_USERNAME:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-123456}}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:-*}"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - media_data:/app/data/media
      - agent_workspace_data:/app/data/agent-workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 前端 ----------
  frontend:
    image: stonewuu/ai-fusion-video-web:latest
    container_name: fusion-frontend
    restart: unless-stopped
    environment:
      # 留空表示由统一入口提供同源 /api；分域部署由覆盖文件传入完整地址。
      PUBLIC_API_URL: "${PUBLIC_API_URL:-}"
    depends_on:
      - backend

  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:alpine
    container_name: fusion-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  redis_data:
  media_data:
  agent_workspace_data:
